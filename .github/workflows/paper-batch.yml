name: Publish prospective paper book

on:
  schedule:
    # 10:49, 15:49 and 20:49 IST, including exceptional weekend sessions.
    - cron: '19 5,10,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospective-paper-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'pankagsaini/volatility-lab' && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Verify standard public repository runner eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install locked worker dependencies
        run: |
          python -m pip install uv==0.13.8
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/paper-deps.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/paper-deps.txt"
      - name: Fetch the current data branch
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/paper-feed
          git worktree add --detach "$RUNNER_TEMP/paper-feed" FETCH_HEAD
      - name: Process archived captures in a private temporary directory
        env:
          PAPER_DRIVE_READER_JSON: ${{ secrets.PAPER_DRIVE_READER_JSON }}
          PAPER_DRIVE_FOLDER_ID: ${{ secrets.PAPER_DRIVE_FOLDER_ID }}
          PAPER_CHECKPOINT_KEY: ${{ secrets.PAPER_CHECKPOINT_KEY }}
          VOL_LAB_DATA_DIR: ${{ runner.temp }}/paper-references
        run: python scripts/build_paper_feed.py "$RUNNER_TEMP/paper-feed"
      - name: Publish one fast-forward commit
        working-directory: ${{ runner.temp }}/paper-feed
        run: |
          git add -- paper-ledger.json paper-checkpoint.gpg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Advance prospective paper book and encrypted checkpoint"
            git push origin HEAD:refs/heads/paper-feed
            echo 'Published the verified paper book and encrypted checkpoint together.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Verified the published checkpoint. No new archive progress to publish.' >> "$GITHUB_STEP_SUMMARY"
          fi
