name: CI & Deployment Parity

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package & dependencies in editable mode
        run: |
          python -m pip install uv==0.13.8
          uv export --locked --extra dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/volatility-lock.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/volatility-lock.txt"
          python -m pip install --no-deps -e .

      - name: Run Focused Ruff Linter (volatility_lab & scripts)
        run: |
          ruff check volatility_lab/ scripts/ pyproject.toml

      - name: Run Automated Remediation & Audit Tests
        run: |
          python -m pytest -ra --cov=volatility_lab --cov-branch --cov-report=term:skip-covered --cov-report=xml --cov-fail-under=31

      - name: Audit installed dependencies
        run: python -m pip_audit --local --skip-editable --disable-pip

      - name: Retain coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

      - name: Build Wheel & Verify Distributable Package Data
        run: |
          pip install build
          python -m build --wheel
          python -c "
          import glob, zipfile
          whls = glob.glob('dist/*.whl')
          assert whls, 'No wheel file generated in dist/'
          with zipfile.ZipFile(whls[0]) as z:
              names = z.namelist()
              print(f'Wheel archive contents: {len(names)} files')
              assert any('volatility_lab/data/expiry_latest.json' in n for n in names), 'expiry_latest.json missing from wheel'
              assert any('volatility_lab/data/banknifty_one_year.csv' in n for n in names), 'csv data missing from wheel'
          print('Wheel package-data verification passed.')
          "

      - name: Smoke-Test Installed Wheel in Clean Virtualenv
        run: |
          python -m venv clean_env
          clean_env/bin/python -m pip install --upgrade pip
          clean_env/bin/python -m pip install dist/*.whl
          wheel_python="$PWD/clean_env/bin/python"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I -c "
          from pathlib import Path
          import sysconfig
          import volatility_lab
          from volatility_lab.forward_test import load_forward_test_ledger, LOT_SIZES
          from volatility_lab.market_calendar import is_trading_day
          from volatility_lab.backtest.forward_test import evaluate_strategies_for_chain as compat
          from volatility_lab.forward_test import evaluate_strategies_for_chain
          assert compat is evaluate_strategies_for_chain
          assert Path(volatility_lab.__file__).resolve().is_relative_to(Path(sysconfig.get_path('purelib')).resolve())
          ledger = load_forward_test_ledger()
          assert ledger['version'] == 'forward-test-v20.1-event-time-gated', 'Bad ledger version'
          assert LOT_SIZES['NIFTY'] == 65, 'Bad NIFTY lot size'
          print('Installed wheel clean-env smoke test passed successfully!')
          "

  deployment-parity:
    name: Verify Web & Deployment Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node for live connection regressions
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify collector and browser live connection
        run: node scripts/test_live_connection.cjs

      - name: Verify chart and scenario regressions
        run: node scripts/test_frontend.cjs

      - name: Verify model selection and official input guards
        run: node scripts/test_pricing_policy.cjs

      - name: Verify Web Asset SHA-256 Parity
        run: |
          python -c "
          import hashlib
          docs_h = hashlib.sha256(open('docs/index.html', 'rb').read()).hexdigest()
          root_h = hashlib.sha256(open('index.html', 'rb').read()).hexdigest()
          print(f'docs/index.html: {docs_h}')
          print(f'index.html:      {root_h}')
          assert docs_h == root_h, 'docs/index.html and index.html must be identical!'
          print('Web parity confirmed.')
          "

      - name: Verify CNAME Configuration
        run: |
          python -c "
          assert open('docs/CNAME').read().strip() == 'volatilitylab.in', 'docs/CNAME must be volatilitylab.in'
          print('CNAME verified: volatilitylab.in')
          "
