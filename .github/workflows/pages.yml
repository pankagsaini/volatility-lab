name: Publish website and daily forecasts

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 3,12,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser calculations and source parity
        run: |
          node scripts/test_live_connection.cjs
          node scripts/test_collector_audit.cjs
          node scripts/test_frontend.cjs
          node scripts/test_pricing_policy.cjs
          cmp index.html docs/index.html
      - name: Install locked publishing and forecasting dependencies
        run: |
          python -m pip install uv==0.13.8
          uv export --locked --no-dev --group publishing --no-emit-project --output-file "$RUNNER_TEMP/pricing-reader.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/pricing-reader.txt"
      - name: Refresh completed broker candles and expiry forecasts
        id: forecasts
        continue-on-error: true
        run: python scripts/refresh_forecasts.py
      - name: Retain dated forecasts when the broker refresh fails
        if: steps.forecasts.outcome == 'failure'
        run: |
          git restore --source=HEAD -- index.html docs/index.html docs/live_state.json volatility_lab/data/nifty_one_year.csv volatility_lab/data/banknifty_one_year.csv volatility_lab/data/reference-manifest.json
          echo '::warning::Forecast refresh failed. Publishing the checked-in dated forecasts; no missing candles or historical IV were filled.'
          echo 'Forecast refresh failed. The website retains the checked-in forecast training dates. See the refresh step for the missing-session or source error.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify refreshed publication
        run: |
          node scripts/test_frontend.cjs
          cmp index.html docs/index.html
      - name: Refresh RBI and NSE inputs in the deployment artifact
        id: pricing
        continue-on-error: true
        run: python scripts/refresh_pricing_inputs.py --output docs/pricing-inputs.json
      - name: Report source outage without disabling the lab
        if: steps.pricing.outcome == 'failure'
        run: echo '::warning::Official source refresh failed. Retaining dated verified inputs; the browser disables model pricing when inputs expire.'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
