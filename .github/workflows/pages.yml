name: Publish website and official pricing inputs

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser calculations and source parity
        run: |
          node scripts/test_live_connection.cjs
          node scripts/test_frontend.cjs
          node scripts/test_pricing_policy.cjs
          cmp index.html docs/index.html
      - name: Install PDF reader
        run: python -m pip install 'pypdf>=4,<7'
      - name: Refresh RBI and NSE inputs in the deployment artifact
        id: pricing
        continue-on-error: true
        run: python scripts/refresh_pricing_inputs.py --output docs/pricing-inputs.json
      - name: Report source outage without disabling the lab
        if: steps.pricing.outcome == 'failure'
        run: echo '::warning::Official source refresh failed. Retaining dated verified inputs; the browser disables model pricing when inputs expire.'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
