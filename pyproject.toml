[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-lab"
version = "18.0.0"
description = "Institutional-grade options volatility analytics and 6-strategy backtest engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Pankaj Saini", email = "pankajsaini2148@gmail.com"}
]
keywords = ["options", "volatility", "bsm", "greeks", "backtesting", "finance", "nse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "streamlit>=1.38.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "arch>=6.3.0",
]

[project.scripts]
volatility-lab = "volatility_lab.runtime.launcher:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "setuptools>=68.0",
    "wheel",
]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["volatility_lab*"]

[tool.setuptools.package-data]
volatility_lab = [
    "data/*.json",
    "data/*.csv",
    "data/charges/upstox/current.json",
    "data/dividend_sources/*.txt",
    "data/upstox/*.json",
    "cloud/apps_script/sync_config.json",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "docs",
    "scratch",
    "patches",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E9",   # Runtime syntax errors
    "F63",  # Invalid type comparisons
    "F7",   # Structural errors
    "F82",  # Undefined loop variables
    "F",    # Pyflakes
]
ignore = [
    "E501", # Line too long
    "E701", # Multiple statements on one line (colon)
    "E702", # Multiple statements on one line (semicolon)
    "F401", # Imported but unused (common in __init__ and test mocks)
    "F841", # Local variable assigned but never used
    "F541", # f-string without placeholders
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
