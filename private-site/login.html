<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Sign in · Volatility Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a101b;color:#edf2fa;font:1rem/1.5 Inter,system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:1.25rem}main{width:min(100%,25rem)}h1{font-size:2rem;line-height:1.2;margin:0 0 1.5rem}p{color:#b7c8e6}label{display:block;margin:1rem 0 .35rem}input:not([type=checkbox]):not([type=hidden]){width:100%;padding:.8rem;border:1px solid #51627a;border-radius:.45rem;background:#111d2e;color:inherit;font:inherit}button{width:100%;padding:.8rem;border:0;border-radius:.45rem;background:#a5cafa;color:#0c182a;font:inherit;font-weight:650;margin-top:1rem;cursor:pointer}:focus-visible{outline:3px solid #c5aaff;outline-offset:3px}[hidden]{display:none!important}
</style></head><body><main><p>Volatility Lab</p><h1 id="title">Sign in</h1>
<form action="/auth/login" method="post">
<div id="emailRow"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="username"></div>
<label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
<label id="rememberRow"><input name="remember" type="checkbox" value="yes"> Remember me for 30 days</label>
<input id="token" name="token" type="hidden"><p role="alert" id="message"></p><button id="submit" type="submit">Sign in</button></form>
<script>
const params=new URLSearchParams(location.search);
const messages={invalid:'Sign-in failed. Check your email and password.',setup:'Password set. Sign in with your new password.',invite:'This setup link could not be used. Request a new invitation.',unavailable:'Sign-in is temporarily unavailable. Please try again.'};
document.querySelector('#message').textContent=messages[params.get('status')]||'';
try{localStorage.removeItem('vl.market.snapshot.v1')}catch{}
const invite=new URLSearchParams(location.hash.slice(1)).get('invite_token');
if(invite){
  history.replaceState(null,'','/login');
  document.querySelector('#title').textContent='Set your password';
  document.querySelector('#submit').textContent='Set password';
  document.querySelector('#emailRow').hidden=true;
  document.querySelector('#email').disabled=true;
  document.querySelector('#rememberRow').hidden=true;
  document.querySelector('#password').autocomplete='new-password';
  document.querySelector('#password').minLength=12;
  document.querySelector('#token').value=invite;
  document.querySelector('form').action='/auth/invite';
}
</script></main></body></html>
