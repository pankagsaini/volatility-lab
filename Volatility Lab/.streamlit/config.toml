[global]
developmentMode = false

[theme]
base = "dark"
primaryColor = "#10b981"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#101b2b"
textColor = "#e5edf5"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
port = 8501
headless = true

folderWatchBlacklist = [".runtime", ".dependencies", "data", "logs", "__pycache__", ".auth"]
