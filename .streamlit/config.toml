[server]
headless = true
fileWatcherType = "auto"
folderWatchBlacklist = [".runtime", ".dependencies", "data", "logs", "__pycache__", ".auth"]

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#10b981"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#111c2d"
textColor = "#e5edf5"
