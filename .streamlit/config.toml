[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "none"
folderWatchBlacklist = [".runtime", ".dependencies", "data", "logs", "__pycache__", ".auth", ".audit_backups"]

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#090d16"
secondaryBackgroundColor = "#111827"
textColor = "#f1f5f9"
font = "sans serif"
