name: CI & Deployment Parity

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Automated Remediation & Audit Tests
        run: |
          python test_audit_remediations.py

  deployment-parity:
    name: Verify Web & Deployment Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Web Asset SHA-256 Parity
        run: |
          python -c "
          import hashlib
          docs_h = hashlib.sha256(open('docs/index.html', 'rb').read()).hexdigest()
          root_h = hashlib.sha256(open('index.html', 'rb').read()).hexdigest()
          print(f'docs/index.html: {docs_h}')
          print(f'index.html:      {root_h}')
          assert docs_h == root_h, 'docs/index.html and index.html must be identical!'
          print('Web parity confirmed.')
          "

      - name: Verify CNAME Configuration
        run: |
          python -c "
          assert open('docs/CNAME').read().strip() == 'volatilitylab.in', 'docs/CNAME must be volatilitylab.in'
          print('CNAME verified: volatilitylab.in')
          "

  sync-branches:
    name: Auto-Sync Master and Main
    needs: [ test-and-lint, deployment-parity ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync master commit to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin master:main --force
